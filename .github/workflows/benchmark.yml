name: benchmark

# Weekly timing and memory of every registered model's score() on the committed ETF bundle, kept as an artifact so a performance regression shows up as a trend.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Benchmark the library
        run: python -m src benchmark --csv benchmark.csv
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.csv
