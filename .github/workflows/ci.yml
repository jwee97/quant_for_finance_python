name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest-cov nbclient ipykernel
      - name: Test with coverage
        run: python -m pytest --cov=src --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  compat:
    # The numerical packages (statistics, probability, econometrics, derivatives, assets, microstructure, research operations, and the multi-asset engine) on the oldest and newest supported Pythons.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest
      - name: Numerical packages
        run: python -m pytest tests/test_stats.py tests/test_probability.py tests/test_econometrics.py tests/test_derivatives.py tests/test_assets.py tests/test_microstructure.py tests/test_ops.py tests/test_instruments.py tests/test_marketdata.py tests/test_ledger.py tests/test_engine.py tests/test_lifecycle.py tests/test_swaps.py tests/test_engine_risk.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests experiments

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t multi-asset-research .
      - name: Run the test suite inside it
        run: docker run --rm multi-asset-research
