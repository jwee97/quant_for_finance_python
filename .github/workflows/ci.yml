name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml-no-ngboost.txt
      - name: Install (CPU-only PyTorch)
        # requirements-ml-no-ngboost.txt: the optional machine-learning packages without NGBoost, whose dependency (lifelines) would replace pandas 3 with pandas 2 in the job that tests pandas 3.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements-ml-no-ngboost.txt
          pip install -e . --no-deps
          pip install pytest-cov pytest-xdist nbclient ipykernel
      - name: Test with coverage
        # A floor under the 91.7% that the suite reaches (4,502 of 54,403 statements unrun), so that code added without tests fails here instead of being noticed later.
        # One process per core, a test file never split between two (``--dist loadfile``): the suite took 57 minutes in one process on a hosted runner. The coverage of the processes is combined.
        run: python -m pytest -n auto --dist loadfile --cov=src --cov-report=term --cov-report=xml --cov-fail-under=88
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  compat:
    # The numerical packages (statistics, probability, econometrics, derivatives and option models, numerics, assets, microstructure, research operations, forecasting, company fundamentals, and the multi-asset engine) on the oldest and newest supported Pythons.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest
      - name: Numerical packages
        run: python -m pytest tests/test_stats.py tests/test_probability.py tests/test_econometrics.py tests/test_derivatives.py tests/test_assets.py tests/test_microstructure.py tests/test_ops.py tests/test_hpo_search.py tests/test_instruments.py tests/test_marketdata.py tests/test_ledger.py tests/test_ledger_operations.py tests/test_margin.py tests/test_performance_metrics.py tests/test_multiple_testing.py tests/test_risk.py tests/test_var_cvar_exact.py tests/test_engine.py tests/test_lifecycle.py tests/test_swaps.py tests/test_engine_risk.py tests/test_forecast_scoring.py tests/test_forecast_base.py tests/test_forecast_methods.py tests/test_forecast_evaluate.py tests/test_forecast_verdict.py tests/test_forecast_cli.py tests/test_forecast_stochvol.py tests/test_forecast_study.py tests/test_numerics.py tests/test_sde.py tests/test_levy.py tests/test_fourier.py tests/test_calibration.py tests/test_pde.py tests/test_pide.py tests/test_exotics.py tests/test_costs.py tests/test_ou.py tests/test_short_rate.py tests/test_trackers.py tests/test_closed_form.py tests/test_ou_pairs.py tests/test_option_models.py tests/test_fund_data.py tests/test_fund_pit.py tests/test_fund_metrics.py tests/test_fund_research.py tests/test_fund_factors.py tests/test_fund_transforms.py tests/test_fund_expr.py tests/test_fund_evaluate.py tests/test_fund_alpha_testing.py tests/test_fund_exact_values.py tests/test_fund_coverage.py tests/test_fund_key_choice.py tests/test_plant_bugs.py tests/test_fund_discovery.py tests/test_fund_combine.py tests/test_fund_bridge.py tests/test_fund_prices.py tests/test_fund_workbench.py tests/test_fund_manual.py tests/test_fund_cli.py tests/test_fund_sec_edgar.py

  replit-python:
    # The dashboard, the iTick client, the tuner, the forecaster, the fundamentals routes and the machine-learning tab on Python 3.10, which is what a Replit workspace runs (the Tests above use 3.11).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml-no-ngboost.txt
            requirements-ml-extras.txt
      - name: Install (CPU-only PyTorch)
        # Every optional package, NGBoost included: Python 3.10 has no pandas 3, so NGBoost's pandas pin costs nothing here (this is the only job that runs the NGBoost tests).
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements-ml-extras.txt
          pip install -e . --no-deps
          pip install pytest
      - name: Dashboard, iTick, Finzdata, tuning, forecasting, fundamentals and machine learning
        run: python -m pytest tests/test_webapp.py tests/test_webapp_data.py tests/test_webapp_data_itick.py tests/test_webapp_data_yahoo.py tests/test_webapp_assets_ml.py tests/test_webapp_labs.py tests/test_server_hardening.py tests/test_tuning.py tests/test_tune_api.py tests/test_tune_study.py tests/test_hpo_search.py tests/test_forecast_scoring.py tests/test_forecast_base.py tests/test_forecast_methods.py tests/test_forecast_evaluate.py tests/test_forecast_verdict.py tests/test_forecast_cli.py tests/test_forecast_api.py tests/test_models_api.py tests/test_fund_api.py tests/test_fund_manual_api.py tests/test_fund_key_choice.py tests/test_fund_sec_edgar.py tests/test_job_lanes.py tests/test_server_tls.py tests/test_live_feed_smoke.py tests/test_itick_access.py tests/test_itick_catalog.py tests/test_itick_history.py tests/test_jobs.py tests/test_yahoo_futures.py tests/test_free_data_core.py tests/test_free_data_crypto.py tests/test_free_data_futures.py tests/test_free_data_options.py tests/test_free_data_finzdata.py tests/test_free_data_finzdata_catalog.py tests/test_webapp_finzdata.py tests/test_webapp_data_finzdata.py tests/test_finzdata_update_script.py tests/test_futures_all_contracts.py tests/test_ml_data.py tests/test_ml_search.py tests/test_ml_integration.py tests/test_ml_phase1.py tests/test_ml_deep.py tests/test_ml_optuna.py tests/test_ml_phase4.py tests/test_ml_rl.py tests/test_ml_rl_accounting_reference.py tests/test_ml_ranker_groups.py tests/test_ml_hmm_reference.py tests/test_ml_graph_masks.py tests/test_ml_output_contracts.py tests/test_ml_serialization_matrix.py tests/test_ml_architecture_contracts.py tests/test_ml_registry_migrations.py tests/test_ml_pipeline.py tests/test_ml_additions.py tests/test_ml_cli.py tests/test_ml_interval_splits.py tests/test_ml_causal_views.py tests/test_ml_feature_audit.py tests/test_ml_oof_lineage.py tests/test_ml_training_isolation.py tests/test_ml_pit_sessions.py tests/test_ml_dependence.py tests/test_ml_inference_parity.py tests/test_ml_inference_bundle.py tests/test_ml_product_surfaces.py tests/test_ml_provenance.py tests/test_ml_holdout_controls.py tests/test_ml_statistical_eligibility.py tests/test_ml_null_pipeline.py tests/test_ml_promotion_gates.py tests/test_ml_research_api.py tests/test_ml_research_cli.py tests/test_ml_execution_ledger.py tests/test_ml_execution_fixtures.py tests/test_ml_execution_pipeline.py tests/test_ml_execution_api.py tests/test_ml_execution_cli.py tests/test_ml_nested_selection.py tests/test_ml_statistical_inference.py tests/test_ml_matched_benchmarks.py tests/test_ml_regime_evaluation.py tests/test_ml_sensitivity.py tests/test_ml_calibration_scores.py tests/test_ml_multiseed.py tests/test_ml_prospective_commitments.py tests/test_ml_forward_equity.py tests/test_ml_validation_policy_governance.py tests/test_ml_statistical_api.py tests/test_ml_statistical_cli.py tests/test_ml_risk_models.py tests/test_ml_allocation.py tests/test_ml_cost_aware_signal.py tests/test_ml_alpha_diagnostics.py tests/test_ml_relative_targets.py tests/test_ml_stable_selection.py tests/test_ml_parsimony.py tests/test_ml_comparison_harness.py tests/test_ml_horizons.py tests/test_ml_r6_reports.py tests/test_ml_alpha_portfolio_surfaces.py tests/test_ml_overlays.py tests/test_ml_calibrated_sizing.py tests/test_ml_regime_exposure.py tests/test_ml_stacked_ensemble.py tests/test_ml_mixture_study.py tests/test_ml_meta_label_audit.py tests/test_ml_delay_report.py tests/test_ml_improvement_families.py tests/test_ml_r7_surfaces.py tests/test_ml_drift.py tests/test_ml_retrain.py tests/test_ml_uncertainty_monitor.py tests/test_ml_champion.py tests/test_ml_repro_report.py tests/test_ml_bma.py tests/test_ml_dro.py tests/test_ml_horizon_combo.py tests/test_ml_transfer.py tests/test_ml_discovery.py tests/test_ml_offpolicy.py tests/test_ml_tax_lots.py tests/test_ml_advanced_surfaces.py tests/test_ml_architecture_catalogue.py tests/test_ml_interval_diagnostics.py tests/test_ml_rl_events.py tests/test_ml_model_selection.py tests/test_ml_simplicity.py tests/test_ml_adaptive_retrain.py tests/test_ml_selection_surfaces.py tests/test_ml_param_schema.py tests/test_ml_model_params_api.py tests/test_ml_ci_policy.py

  ml-base:
    # The machine-learning tab on the base install alone (no optional package): a model whose package is missing is listed as unavailable with the reason, and every other model, the pipeline and the endpoints work as before.
    # The tests that need an extra package skip themselves; the ones that simulate its absence, and that importing the modules loads none of them, run.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest
      - name: Machine learning without the optional packages
        run: python -m pytest tests/test_ml_integration.py tests/test_ml_pipeline.py tests/test_ml_additions.py tests/test_ml_phase1.py tests/test_ml_phase4.py tests/test_ml_rl.py tests/test_ml_optuna.py tests/test_optional_packages.py tests/test_ml_rl_accounting_reference.py tests/test_ml_ranker_groups.py tests/test_ml_hmm_reference.py tests/test_ml_graph_masks.py tests/test_ml_output_contracts.py tests/test_ml_serialization_matrix.py tests/test_ml_architecture_contracts.py tests/test_ml_registry_migrations.py tests/test_ml_interval_splits.py tests/test_ml_causal_views.py tests/test_ml_feature_audit.py tests/test_ml_oof_lineage.py tests/test_ml_training_isolation.py tests/test_ml_pit_sessions.py tests/test_ml_dependence.py tests/test_ml_inference_parity.py tests/test_ml_inference_bundle.py tests/test_ml_product_surfaces.py tests/test_ml_provenance.py tests/test_ml_holdout_controls.py tests/test_ml_statistical_eligibility.py tests/test_ml_null_pipeline.py tests/test_ml_promotion_gates.py tests/test_ml_research_api.py tests/test_ml_research_cli.py tests/test_ml_execution_ledger.py tests/test_ml_execution_fixtures.py tests/test_ml_execution_pipeline.py tests/test_ml_execution_api.py tests/test_ml_execution_cli.py tests/test_ml_nested_selection.py tests/test_ml_statistical_inference.py tests/test_ml_matched_benchmarks.py tests/test_ml_regime_evaluation.py tests/test_ml_sensitivity.py tests/test_ml_calibration_scores.py tests/test_ml_multiseed.py tests/test_ml_prospective_commitments.py tests/test_ml_forward_equity.py tests/test_ml_validation_policy_governance.py tests/test_ml_statistical_api.py tests/test_ml_statistical_cli.py tests/test_ml_risk_models.py tests/test_ml_allocation.py tests/test_ml_cost_aware_signal.py tests/test_ml_alpha_diagnostics.py tests/test_ml_relative_targets.py tests/test_ml_stable_selection.py tests/test_ml_parsimony.py tests/test_ml_comparison_harness.py tests/test_ml_horizons.py tests/test_ml_r6_reports.py tests/test_ml_alpha_portfolio_surfaces.py tests/test_ml_overlays.py tests/test_ml_calibrated_sizing.py tests/test_ml_regime_exposure.py tests/test_ml_stacked_ensemble.py tests/test_ml_mixture_study.py tests/test_ml_meta_label_audit.py tests/test_ml_delay_report.py tests/test_ml_improvement_families.py tests/test_ml_r7_surfaces.py tests/test_ml_drift.py tests/test_ml_retrain.py tests/test_ml_uncertainty_monitor.py tests/test_ml_champion.py tests/test_ml_repro_report.py tests/test_ml_bma.py tests/test_ml_dro.py tests/test_ml_horizon_combo.py tests/test_ml_transfer.py tests/test_ml_discovery.py tests/test_ml_offpolicy.py tests/test_ml_tax_lots.py tests/test_ml_advanced_surfaces.py tests/test_ml_architecture_catalogue.py tests/test_ml_interval_diagnostics.py tests/test_ml_rl_events.py tests/test_ml_model_selection.py tests/test_ml_simplicity.py tests/test_ml_adaptive_retrain.py tests/test_ml_selection_surfaces.py tests/test_ml_param_schema.py tests/test_ml_model_params_api.py tests/test_ml_ci_policy.py -q

  ml-correctness:
    # The blocking lane for the model-correctness requirements (docs/ml_correctness_v3): the numerical, causal-view, contract and serialization checks, run through `ml-verify` so that the result is recorded
    # as evidence, and required to be `pass` and current. A skipped family is `blocked`, not a pass. NGBoost is left out (it needs pandas below 3); the Python 3.10 job covers it.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml-no-ngboost.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements-ml-no-ngboost.txt
          pip install -e . --no-deps
          pip install pytest
      - name: Model-correctness requirements
        run: python -m src.cli ml-verify --run --require-pass --registry artifacts/ml-ci
      - name: Evidence
        if: always()
        run: python -m src.cli ml-verify --json --registry artifacts/ml-ci > ml-verification.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-verification
          path: |
            ml-verification.json
            artifacts/ml-ci/verification/

  browser:
    # The tests that drive the dashboard in a real Chromium (tabs, charts, keyboard, accessibility). Without Playwright they are skipped, which is how they went unrun in the Tests job.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml-no-ngboost.txt
      - name: Install (CPU-only PyTorch) and Chromium
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements-ml-no-ngboost.txt
          pip install -e . --no-deps
          pip install pytest playwright
          playwright install --with-deps chromium
      - name: Dashboard in a browser
        run: python -m pytest tests/test_dashboard.py tests/test_webapp_browser.py tests/test_webapp_itick_browser.py tests/test_webapp_finzdata_browser.py tests/test_webapp_runs_browser.py tests/test_webapp_tune_browser.py tests/test_webapp_forecast_browser.py tests/test_webapp_workspaces_browser.py tests/test_webapp_models_browser.py tests/test_webapp_ml_models_browser.py tests/test_webapp_ml_execution_browser.py tests/test_webapp_ml_validation_browser.py tests/test_webapp_ml_alpha_browser.py tests/test_webapp_ml_r7_browser.py tests/test_webapp_ml_r8_browser.py tests/test_webapp_ml_intervals_browser.py tests/test_webapp_ml_selection_browser.py tests/test_webapp_fundamentals_browser.py tests/test_webapp_fundamentals_sec_browser.py tests/test_webapp_fundamentals_enter_browser.py tests/test_webapp_accessibility.py

  docs:
    # The documentation site must build with no broken link or missing page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "mkdocs>=1.6" "mkdocs-material>=9.5"
      - run: mkdocs build --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests experiments

  docker:
    # Not behind the test job: the image is built and its suite run beside it, so the two take the time of the longer one and not the sum (they were run one after the other, 57 and 43 minutes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t multi-asset-research .
      - name: Run the test suite inside it
        run: docker run --rm multi-asset-research python -m pytest -q -n auto --dist loadfile
