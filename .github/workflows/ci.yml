name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest-cov nbclient ipykernel
      - name: Test with coverage
        # A floor under the 90% that the suite reaches (4,103 of 42,829 statements unrun), so that code added without tests fails here instead of being noticed later.
        run: python -m pytest --cov=src --cov-report=term --cov-report=xml --cov-fail-under=88
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  compat:
    # The numerical packages (statistics, probability, econometrics, derivatives, assets, microstructure, research operations, and the multi-asset engine) on the oldest and newest supported Pythons.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest
      - name: Numerical packages
        run: python -m pytest tests/test_stats.py tests/test_probability.py tests/test_econometrics.py tests/test_derivatives.py tests/test_assets.py tests/test_microstructure.py tests/test_ops.py tests/test_hpo_search.py tests/test_instruments.py tests/test_marketdata.py tests/test_ledger.py tests/test_engine.py tests/test_lifecycle.py tests/test_swaps.py tests/test_engine_risk.py

  replit-python:
    # The dashboard, the iTick client, the tuner and the machine-learning tab on Python 3.10, which is what a Replit workspace runs (the Tests above use 3.11).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest
      - name: Dashboard, iTick, tuning and machine learning
        run: python -m pytest tests/test_webapp.py tests/test_webapp_data.py tests/test_webapp_data_itick.py tests/test_webapp_data_yahoo.py tests/test_webapp_assets_ml.py tests/test_webapp_labs.py tests/test_server_hardening.py tests/test_tuning.py tests/test_tune_api.py tests/test_tune_study.py tests/test_hpo_search.py tests/test_itick_access.py tests/test_itick_catalog.py tests/test_itick_history.py tests/test_jobs.py tests/test_yahoo_futures.py tests/test_free_data_core.py tests/test_free_data_crypto.py tests/test_free_data_futures.py tests/test_free_data_options.py tests/test_ml_data.py tests/test_ml_search.py tests/test_ml_pipeline.py tests/test_ml_additions.py tests/test_ml_cli.py

  browser:
    # The tests that drive the dashboard in a real Chromium (tabs, charts, keyboard, accessibility). Without Playwright they are skipped, which is how they went unrun in the Tests job.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch) and Chromium
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest playwright
          playwright install --with-deps chromium
      - name: Dashboard in a browser
        run: python -m pytest tests/test_dashboard.py tests/test_webapp_browser.py tests/test_webapp_itick_browser.py tests/test_webapp_runs_browser.py tests/test_webapp_tune_browser.py tests/test_webapp_workspaces_browser.py tests/test_webapp_accessibility.py

  docs:
    # The documentation site must build with no broken link or missing page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "mkdocs>=1.6" "mkdocs-material>=9.5"
      - run: mkdocs build --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests experiments

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t multi-asset-research .
      - name: Run the test suite inside it
        run: docker run --rm multi-asset-research
