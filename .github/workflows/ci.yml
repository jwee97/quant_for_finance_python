name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest-cov
      - name: Test with coverage
        run: python -m pytest --cov=src --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests experiments

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t multi-asset-research .
      - name: Run the test suite inside it
        run: docker run --rm multi-asset-research
