name: dependency audit

# Weekly (and on demand) check of the packages the application installs against the public vulnerability databases (PyPI's advisories and OSV). The tests cannot notice a vulnerable dependency; this run does.
# It installs requirements.txt as a user would (everything from PyPI, except that PyTorch comes as its CPU build) in an environment of its own that has no pip or setuptools of its own, so that only what the
# application brings is audited (the first run audited the pip 24.0 and setuptools 79.0.1 a new environment starts with, which the application neither brings nor uses), on the two interpreters it supports:
# Python 3.11 and Python 3.10, which is what a Replit workspace runs and where some packages stop at older releases. The versions are audited as listed (the "+cpu" label of the CPU build of PyTorch removed,
# which PyPI does not know). The run fails when any installed package has a known vulnerability. One that has no fixed release, or that cannot matter here, is listed in .github/pip-audit-ignore.txt
# (one advisory id per line, with the reason in a comment) and the run passes again.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the application's requirements in an environment of their own (CPU-only PyTorch)
        run: |
          python -m venv --without-pip /tmp/app
          pip --python /tmp/app/bin/python install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip --python /tmp/app/bin/python freeze | sed 's/+cpu$//' | tee /tmp/installed.txt
      - name: Audit what was installed
        run: |
          pip install pip-audit
          args=""
          if [ -f .github/pip-audit-ignore.txt ]; then
            for id in $(grep -v '^[[:space:]]*#' .github/pip-audit-ignore.txt | awk '{print $1}'); do args="$args --ignore-vuln $id"; done
          fi
          pip-audit --requirement /tmp/installed.txt --no-deps --disable-pip --progress-spinner off $args
