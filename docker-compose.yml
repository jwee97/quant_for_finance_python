# docker compose up app                                   # the dashboard on http://localhost:5000, with everything it keeps in ./data/user (docs/deployment.md)
# docker compose run --rm tests
# docker compose run --rm pipeline                       # all 29 stages (about 80 minutes on 4 cores)
# docker compose run --rm pipeline python -m experiments.run_all --generation 4
services:
  app:
    build: .
    command: python -u -m src serve --host 0.0.0.0 --port 5000 --no-browser
    ports:
      # Local only by default: the dashboard has no login of its own unless QUANT_LAB_ACCESS_CODE is set. To reach it from other machines set QUANT_LAB_BIND=0.0.0.0 AND an access code (docs/deployment.md).
      - "${QUANT_LAB_BIND:-127.0.0.1}:5000:5000"
    environment:
      QUANT_LAB_ACCESS_CODE: ${QUANT_LAB_ACCESS_CODE:-}    # a code the page asks for before it serves anything; read from the shell or from .env next to this file
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      FINZDATA_API_KEY: ${FINZDATA_API_KEY:-}
    volumes:
      - ./data/user:/app/data/user                         # the databases, downloads and results survive a restart and a rebuild. Create it first (mkdir -p data/user) or Docker makes it owned by root and the app cannot write to it
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
  tests:
    build: .
    command: python -m pytest -q
  pipeline:
    build: .
    command: python -m experiments.run_all
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./experiments/registry.jsonl:/app/experiments/registry.jsonl
      - ./experiments/registry.md:/app/experiments/registry.md
