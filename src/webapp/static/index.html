<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Quant Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 12l4-5 3 3 5-7' fill='none' stroke='%232a78d6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <h1 class="brand">Quant Lab<small>backtest your ideas honestly</small></h1>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-backtest" aria-selected="true" aria-controls="view-backtest">Backtest</button>
    <button role="tab" id="tab-compare" aria-selected="false" aria-controls="view-compare">Compare <span class="pill" id="runcount">0</span></button>
    <button role="tab" id="tab-builder" aria-selected="false" aria-controls="view-builder">Strategy builder</button>
    <button role="tab" id="tab-tune" aria-selected="false" aria-controls="view-tune">Tune</button>
    <button role="tab" id="tab-forecast" aria-selected="false" aria-controls="view-forecast">Forecast</button>
    <button role="tab" id="tab-options" aria-selected="false" aria-controls="view-options">Options</button>
    <button role="tab" id="tab-futures" aria-selected="false" aria-controls="view-futures">Futures</button>
    <button role="tab" id="tab-crypto" aria-selected="false" aria-controls="view-crypto">Crypto</button>
    <button role="tab" id="tab-ml" aria-selected="false" aria-controls="view-ml">Machine learning</button>
    <button role="tab" id="tab-exec" aria-selected="false" aria-controls="view-exec">Execution</button>
    <button role="tab" id="tab-cash" aria-selected="false" aria-controls="view-cash">Cash flows</button>
    <button role="tab" id="tab-guides" aria-selected="false" aria-controls="view-guides">Guides</button>
  </nav>
  <div class="grow"></div>
  <span class="pill" id="trials" title="Every distinct idea you test on the same tickers counts as a trial. The deflated Sharpe probability is penalised for the number of trials, because the best of many tries looks good by luck."></span>
  <button class="iconbtn" id="theme" aria-label="Switch between light and dark theme">Theme</button>
</header>
<main>
  <div class="notice" id="notice" role="status" hidden></div>
  <section role="tabpanel" id="view-backtest" aria-labelledby="tab-backtest">
    <div class="layout">
      <aside class="card panel" id="panel" aria-label="Backtest setup"></aside>
      <div class="stack" id="results" aria-live="polite"></div>
    </div>
  </section>
  <section role="tabpanel" id="view-compare" aria-labelledby="tab-compare" hidden><div class="stack" id="compare"></div></section>
  <section role="tabpanel" id="view-builder" aria-labelledby="tab-builder" hidden><div class="stack" id="builder"></div></section>
  <section role="tabpanel" id="view-tune" aria-labelledby="tab-tune" hidden><div class="lab" id="tune"></div></section>
  <section role="tabpanel" id="view-forecast" aria-labelledby="tab-forecast" hidden><div class="lab" id="forecast"></div></section>
  <section role="tabpanel" id="view-options" aria-labelledby="tab-options" hidden><div class="lab" id="options"></div></section>
  <section role="tabpanel" id="view-futures" aria-labelledby="tab-futures" hidden><div class="lab" id="futures"></div></section>
  <section role="tabpanel" id="view-crypto" aria-labelledby="tab-crypto" hidden><div class="lab" id="crypto"></div></section>
  <section role="tabpanel" id="view-ml" aria-labelledby="tab-ml" hidden><div class="lab" id="ml"></div></section>
  <section role="tabpanel" id="view-exec" aria-labelledby="tab-exec" hidden><div class="lab" id="exec"></div></section>
  <section role="tabpanel" id="view-cash" aria-labelledby="tab-cash" hidden><div class="lab" id="cash"></div></section>
  <section role="tabpanel" id="view-guides" aria-labelledby="tab-guides" hidden><div class="guides" id="guides"></div></section>
</main>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
<script src="/static/workspace.js"></script>
<script src="/static/options.js"></script>
<script src="/static/futures.js"></script>
<script src="/static/crypto.js"></script>
<script src="/static/ml.js"></script>
<script src="/static/tune.js"></script>
<script src="/static/forecast.js"></script>
</body>
</html>
