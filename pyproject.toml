[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-multi-asset-research"
version = "1.0.0"
description = "Systematic Multi-Asset Alpha, Portfolio Construction & Risk Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "arch>=6.2",
    "hmmlearn>=0.3",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
distributed = ["dask[distributed]>=2024.1", "ray>=2.9"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "nbclient>=0.10", "ipykernel>=6.29"]
foundation = ["chronos-forecasting>=2.0", "einops>=0.8", "transformers>=4.40", "timesfm[torch]>=3.0"]

[project.scripts]
quant = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.webapp" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A gate the existing code passes: real errors, undefined names, unused imports and f-strings without placeholders.
# Style rules (E741, E731) and unused local variables (F841) are not enforced.
select = ["E9", "F63", "F7", "F82", "F401", "F541", "F811"]

[tool.coverage.run]
source = ["src"]
omit = ["*/__main__.py"]
