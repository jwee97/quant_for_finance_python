      - Using the dashboard: dashboard.md
      - How to add a strategy: how_to_add_a_strategy.md
      - Glossary: glossary.md
      - Chapter map: chapter_map.md
  - Technique guides: techniques/index.md
  - Strategy cards: strategies/index.md
  - Strategy survey: strategy_survey.md
  - What was built: roadmap_coverage.md
  - Findings digest: generated/findings.md
