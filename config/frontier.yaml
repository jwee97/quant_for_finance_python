# ---------------------------------------------------------------------------
# Frontier research models (Generation 5). One section per stage, each committed BEFORE its stage was run.
# ---------------------------------------------------------------------------

# ===== Stage 33: the deep-forecasting family, graph networks and Bayesian deep learning =====
deep_family:
  # Stage 27 found that its "win" over the Stage 19 ridge was the ridge's weakness: the mixer was no better than each asset's historical mean.
  # This stage therefore declares the historical mean as the PRIMARY benchmark, and the ridge as the secondary.
  task: "identical to Stage 27: 21-day return / EWMA volatility forecast at the origin, 252 normalised daily returns, annual walk-forward refits from the Stage 19 schedule, same rows"
  models:
    nbeats:    { description: "N-BEATS (Oreshkin et al. 2020), generic: 3 blocks of 4 fully connected layers (width 64) with backcast residuals and a summed forecast", blocks: 3, layers: 4, width: 64, dropout: 0.2, asset_embedding: 8 }
    nhits:     { description: "N-HiTS (Challu et al. 2023): N-BEATS blocks that see the window pooled at three rates (12, 3, 1 days), so slow structure is read from a short summary", pools: [12, 3, 1], layers: 3, width: 64, dropout: 0.2, asset_embedding: 8 }
    timemixer: { description: "TimeMixer-style multiscale mixing (Wang et al. 2024), simplified: the window at scales 1, 3 and 7 days each through an MLP, mixed by a head. Not the full decomposable-mixing architecture", scales: [1, 3, 7], width: 32, dropout: 0.2, asset_embedding: 8 }
    gat:       { description: "Graph attention network (Velickovic et al. 2018) over the 15 ETFs: nodes carry the twelve Stage 19 price features and an asset embedding; edges join each ETF to its 4 most correlated others over the previous 252 days, recomputed at every row", heads: 2, hidden: 32, k_neighbours: 4, dropout: 0.2 }
  training: { learning_rate: 1.0e-3, weight_decay: 1.0e-2, batch_size: 256, max_epochs: 30, patience: 5, validation_fraction: 0.20, ensemble_seeds: [11, 12, 13], rows: "every 5th trading day, all assets pooled" }
  bayesian:
    method: "deep ensemble (three seeds) plus Monte Carlo dropout (30 stochastic passes) for the best model by primary-benchmark CRPS difference; epistemic variance of the z-score forecast = variance across the 3 x 30 predictions"
    mc_samples: 30        # machine-readable form of "30 stochastic passes" above; no value changed
    combine: "forecast std = EWMA sigma * sqrt(1 + epistemic variance of z); no free parameter"
  decisions:
    fdr: 0.10
    # h_frontier: at least one of {nbeats, nhits, timemixer, gat} has a significantly LOWER mean CRPS than the HISTORICAL-MEAN forecast (Diebold-Mariano
    #   on the 187 monthly cross-asset means, two-sided, Benjamini-Hochberg across the four, negative loss difference).
    # h_bayesian: for the best of the four, replacing the EWMA forecast std by the ensemble-widened std lowers the mean CRPS (Diebold-Mariano, p <= 0.10, negative difference).
    # Reported, not judged: each model against the Stage 19 ridge and against the Stage 27 mixer and transformer; rank IC; parameter counts; seed dispersion;
    #   coverage of the 50% and 90% predictive intervals with and without the epistemic term.

# ===== Stage 34: a zero-shot time-series foundation model =====
foundation:
  model: "Chronos-Bolt (small), amazon/chronos-bolt-small, run zero-shot: no fine-tuning, no parameter touches any ETF data"
  task: "the 252 normalised daily returns before each Stage 19 origin (same window and normalisation as Stage 27) are the context; the model's median path for the next 21 days is summed and multiplied by the daily EWMA volatility at the origin to give a 21-day return forecast; the Stage 19 EWMA 21-day sigma is the spread, as in every other forecast stage"
  rows: "the Stage 19 (origin, asset) rows, identical to Stages 27 and 33"
  contamination: "The pre-training corpus of Chronos models is large and only partly documented, and covers dates that overlap this sample. Whether it contains these ETFs' prices is unknown. A good result would therefore not be clean evidence; a bad one is clean evidence of no skill. This asymmetry is stated before the result."
  decisions: "None. The stage is descriptive: mean CRPS against the historical mean and the Stage 19 ridge (Diebold-Mariano, two-sided), rank IC, and the share of the median-path sum that is distinguishable from zero. No decision is registered, so no hypothesis can be retained or rejected on this stage."

# ===== Stage 35: explainability and calibration of the forecasts =====
explain_calibrate:
  explain:
    purpose: "Teaching and auditing, not a hypothesis. Explain two models fitted on the twelve Stage 19 price features to a 21-day z-score target, annually refitted on the Stage 19 schedule: a small MLP (hidden 16, ReLU, weight decay 1e-2) and a gradient-boosted tree model (sklearn HistGradientBoosting, depth 3, 100 iterations, learning rate 0.05)."
    methods: ["permutation importance on the out-of-sample rows (mean rise in MSE over 20 shuffles, seed 7)", "exact interventional Shapley values by enumerating all 2^12 feature subsets against a background of 50 training rows (on 200 out-of-sample rows)", "integrated gradients on the MLP with a zero (= training-mean) baseline and 100 trapezoid steps"]
    checks: "Completeness is tested, not assumed: for every explained row the Shapley values must sum to f(x) minus the mean background prediction (tolerance 1e-6) and the integrated gradients to f(x) minus f(baseline) (tolerance 1e-2 of the range). Failures are reported. Global importance rankings are compared across methods with Spearman correlation; disagreement is reported, not resolved."
  calibration:
    task: "Stage 19's price-only classifier gives p_raw for 'the asset's 21-day return is positive'. Starting 2016-01-31 (60 months of matured history), at each monthly origin fit Platt scaling and isotonic regression on the p_raw and outcomes of all earlier origins whose 21-day outcome had matured before the origin, then apply them to that origin's p_raw. Raw p_raw is the third arm."
    metrics: ["log loss", "Brier score", "expected calibration error (10 equal-count bins)"]
    decisions:
      fdr: 0.10
      # h_isotonic: isotonic recalibration has a lower mean log loss than Platt scaling (Diebold-Mariano on monthly cross-asset means, two-sided, p <= 0.10, negative difference).
      # Reported, not judged: Platt vs raw; isotonic vs raw; Brier; ECE; reliability tables; Stage 19's own p_cal.
